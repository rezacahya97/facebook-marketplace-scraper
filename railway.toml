[build]
builder = "nixpacks"

[deploy]
startCommand = "apt-get update && apt-get install -y libnss3 libatk1.0-0 libdrm2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libasound2t64 libdbus-1-3 libatk-bridge2.0-0 libcups2 libxkbcommon0 libatspi2.0-0 libxfixes3 libpango-1.0-0 libcairo2 && playwright install chromium && python app.py"
healthcheckPath = "/"
healthcheckTimeout = 300 